[pytest]
# Avoid descending into .pytest_tmp which may be left with restricted ACLs
# during prior test runs on Windows CI or local machines. This prevents
# PermissionError during collection when the directory exists but is not
# accessible to the current user.
norecursedirs = .pytest_tmp

# Keep default test discovery rules, but keep collection concise in CI
addopts = -ra --basetemp=.pytest_work
