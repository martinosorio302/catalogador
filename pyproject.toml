# Ruff configuration for Catalogador project
[tool.ruff]
# Exclude specific directories from linting
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "node_modules",
    "dist",
    "dist-electron",
    "build",
    "catalogador.egg-info",
    "pr_bundle",
    "pr_bundle_v2",
    "frontend/node_modules",
    "src/node_modules",
    "app-desktop",
    "PCD-EsSalud-OUT",
]

# Set line length
line-length = 100

# Target Python 3.11+
target-version = "py311"

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]

# Ignore specific rules that are too strict or not relevant
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function call in argument defaults
    "B904",  # raise from None
]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Like Black, respect magic trailing commas
skip-magic-trailing-comma = false

# Like Black, automatically detect the line ending
line-ending = "auto"
