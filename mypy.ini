[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
explicit_package_bases = True
namespace_packages = True

# Exclude problematic directories
exclude = (?x)(
    ^pr_bundle/
    | ^pr_bundle_v2/
    | ^dist/
    | ^dist-electron/
    | ^build/
    | ^node_modules/
    | ^venv/
    | ^\.venv/
    | ^\.pytest_cache/
    | ^\.mypy_cache/
    | ^\.ruff_cache/
    | ^catalogador\.egg-info/
    | ^frontend/
    | ^src/
    | ^electron/
    | ^app-desktop/
    | ^PCD-EsSalud-OUT/
    | ^tools/
    | ^scripts/
  )
