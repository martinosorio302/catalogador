name: Smoke test

on:
  pull_request:
  push:
    branches: [ main, fix/ruff-auto-fixes-20251110 ]

jobs:
  smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt } else { echo 'No requirements.txt' }
      - name: Run CI smoke test
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci_smoke_test.ps1 -TimeoutSec 60 -PollIntervalSec 3
